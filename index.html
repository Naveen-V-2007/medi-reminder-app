<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<meta name="theme-color" content="#0f0f0f"/>
<link rel="manifest" href="manifest.json"/>
<title>MediCare – Medicine Reminder</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet"/>
<style>
  :root {
    --bg: #f7f5f2;
    --surface: #ffffff;
    --surface2: #f0ede8;
    --border: #e2ddd6;
    --text: #1a1814;
    --text2: #6b6560;
    --accent: #1a1814;
    --accent2: #c8a96e;
    --danger: #c0392b;
    --success: #27ae60;
    --warn: #e67e22;
    --shadow: 0 2px 20px rgba(0,0,0,0.06);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.10);
    --radius: 16px;
    --radius-sm: 10px;
  }
  [data-theme="dark"] {
    --bg: #0f0e0c;
    --surface: #1a1916;
    --surface2: #222018;
    --border: #2e2c28;
    --text: #f0ede8;
    --text2: #9b9690;
    --accent: #f0ede8;
    --accent2: #c8a96e;
    --shadow: 0 2px 20px rgba(0,0,0,0.3);
    --shadow-lg: 0 8px 40px rgba(0,0,0,0.4);
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family: 'DM Sans', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    transition: background 0.3s, color 0.3s;
  }

  /* ── APP SHELL ── */
  #app { display: flex; height: 100vh; overflow: hidden; }

  /* ── SIDEBAR ── */
  #sidebar {
    width: 260px;
    background: var(--surface);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    padding: 28px 0;
    flex-shrink: 0;
  }
  .sidebar-logo { padding: 0 24px 28px; border-bottom: 1px solid var(--border); }
  .sidebar-logo h1 { font-family: 'DM Serif Display', serif; font-size: 1.5rem; color: var(--text); }
  .sidebar-logo span { color: var(--accent2); }
  .nav-list { list-style: none; padding: 20px 12px; flex: 1; }
  .nav-item {
    display: flex; align-items: center; gap: 12px; padding: 12px 14px;
    border-radius: var(--radius-sm); cursor: pointer; font-size: 0.875rem;
    font-weight: 500; color: var(--text2); transition: all 0.2s; margin-bottom: 4px;
  }
  .nav-item:hover { background: var(--surface2); color: var(--text); }
  .nav-item.active { background: var(--accent); color: var(--bg); }

  /* ── MAIN CONTENT ── */
  #main { flex: 1; overflow-y: auto; background: var(--bg); }
  .page { display: none; padding: 36px; animation: fadeIn 0.3s ease; }
  .page.active { display: block; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:translateY(0); } }

  /* ── CARDS & FORMS ── */
  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 28px; margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .form-group { display: flex; flex-direction: column; gap: 6px; }
  .form-group.full { grid-column: 1/-1; }
  input, select {
    background: var(--surface2); border: 1px solid var(--border);
    border-radius: var(--radius-sm); padding: 11px 14px; font-size: 0.9rem;
    color: var(--text); outline: none; width: 100%;
  }

  /* ── COLOUR PICKER ── */
  .colour-grid { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 4px; }
  .colour-chip {
    width: 32px; height: 32px; border-radius: 50%; cursor: pointer;
    border: 3px solid transparent; transition: transform 0.2s;
  }
  .colour-chip.selected { border-color: var(--accent); transform: scale(1.15); }

  /* ── TIME SLOTS ── */
  .time-slot-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .slot-btn {
    padding: 10px 8px; border: 1px solid var(--border); border-radius: var(--radius-sm);
    background: var(--surface2); color: var(--text2); cursor: pointer; text-align: center;
  }
  .slot-btn.selected { background: var(--accent); color: var(--bg); }

  /* ── DASHBOARD STATS ── */
  .stats-row { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
  .stat-card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 22px; }
  .stat-value { font-family: 'DM Serif Display', serif; font-size: 2.2rem; margin-top: 6px; }

  .btn-primary {
    background: var(--accent); color: var(--bg); border: none; padding: 13px 28px;
    border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; width: 100%; margin-top: 10px;
  }
  .btn-danger { background: transparent; color: var(--danger); border: 1px solid var(--danger); padding: 6px 12px; border-radius: 8px; cursor: pointer; }

  .med-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
  .med-table th { text-align: left; font-size: 0.75rem; color: var(--text2); padding: 10px; border-bottom: 1px solid var(--border); }
  .med-table td { padding: 12px 10px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }

  #toast {
    position: fixed; bottom: 20px; right: 20px; background: var(--accent); color: var(--bg);
    padding: 12px 20px; border-radius: 8px; transform: translateY(100px); transition: 0.3s; z-index: 1000;
  }
  #toast.show { transform: translateY(0); }

  @media (max-width: 768px) {
    #sidebar { display: none; }
    .form-grid, .stats-row { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<div id="app">
  <nav id="sidebar">
    <div class="sidebar-logo">
      <h1>Medi<span>Care</span></h1>
      <p>Smart Reminder</p>
    </div>
    <ul class="nav-list">
      <li class="nav-item active" onclick="showPage('dashboard')">Dashboard</li>
      <li class="nav-item" onclick="showPage('add')">Add Medicine</li>
      <li class="nav-item" onclick="showPage('caretaker')">Caretakers</li>
    </ul>
  </nav>

  <main id="main">
    <div class="page active" id="page-dashboard">
      <div class="stats-row">
        <div class="stat-card"><div>Total Patients</div><div class="stat-value" id="stat-total">0</div></div>
        <div class="stat-card"><div>Low Stock</div><div class="stat-value" id="stat-low" style="color:var(--danger)">0</div></div>
      </div>
      <div class="card">
        <h3>Current Schedule</h3>
        <div id="med-list-dash"></div>
      </div>
    </div>

    <div class="page" id="page-add">
      <div class="card">
        <div class="form-grid">
          <div class="form-group"><label>Patient Name</label><input type="text" id="patientName"></div>
          <div class="form-group"><label>Medicine Name</label><input type="text" id="medName"></div>
          <div class="form-group"><label>Stock (Tablets)</label><input type="number" id="stock"></div>
          <div class="form-group"><label>Dose Count</label><input type="number" id="doses" value="1"></div>
        </div>
      </div>
      <div class="card">
        <label>Select Colour</label>
        <div class="colour-grid" id="colourGrid"></div>
      </div>
      <div class="card">
        <label>Schedule</label>
        <div class="time-slot-grid">
          <div class="slot-btn" data-slot="morning" onclick="toggleSlot(this)">🌅 Morning</div>
          <div class="slot-btn" data-slot="afternoon" onclick="toggleSlot(this)">☀️ Afternoon</div>
          <div class="slot-btn" data-slot="evening" onclick="toggleSlot(this)">🌆 Evening</div>
          <div class="slot-btn" data-slot="night" onclick="toggleSlot(this)">🌙 Night</div>
        </div>
        <div id="timeInputs" style="margin-top:15px"></div>
      </div>
      <button class="btn-primary" onclick="saveMedicine()">Save Reminder</button>
    </div>
  </main>
</div>

<div id="toast"></div>

<script>
// --- DATA HELPERS ---
function getData() { return JSON.parse(localStorage.getItem('medicare_data') || '{"medicines":[]}'); }
function saveData(d) { localStorage.setItem('medicare_data', JSON.stringify(d)); }

// --- INDEXEDDB FOR BACKGROUND NOTIFICATIONS ---
async function syncToIndexedDB(medicine) {
    const request = indexedDB.open('MedicareDB', 1);
    request.onupgradeneeded = (e) => {
        const db = e.target.result;
        if (!db.objectStoreNames.contains('medicines')) {
            db.createObjectStore('medicines', { keyPath: 'id' });
        }
    };
    request.onsuccess = (e) => {
        const db = e.target.result;
        const tx = db.transaction('medicines', 'readwrite');
        tx.objectStore('medicines').put(medicine);
    };
}

// --- COLOUR PICKER ---
const COLOURS = [{name:'White',hex:'#ffffff'},{name:'Red',hex:'#eb4d4b'},{name:'Blue',hex:'#4a90d9'},{name:'Green',hex:'#6ab04c'},{name:'Yellow',hex:'#f9ca24'}];
let selectedColour = COLOURS[0];

function buildColours() {
    const grid = document.getElementById('colourGrid');
    grid.innerHTML = COLOURS.map((c, i) => `
        <div class="colour-chip ${i===0?'selected':''}" style="background:${c.hex}" onclick="selectColour(${i}, this)"></div>
    `).join('');
}
function selectColour(i, el) {
    document.querySelectorAll('.colour-chip').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    selectedColour = COLOURS[i];
}

// --- TIME SLOTS ---
let selectedSlots = new Set();
const defaultTimes = { morning:'08:00', afternoon:'13:00', evening:'18:00', night:'21:00' };

function toggleSlot(btn) {
    const slot = btn.dataset.slot;
    if (selectedSlots.has(slot)) {
        selectedSlots.delete(slot);
        btn.classList.remove('selected');
    } else {
        selectedSlots.add(slot);
        btn.classList.add('selected');
    }
    renderTimeInputs();
}

function renderTimeInputs() {
    const cont = document.getElementById('timeInputs');
    cont.innerHTML = [...selectedSlots].map(slot => `
        <div class="form-group" style="margin-bottom:10px">
            <label>${slot.toUpperCase()} Time</label>
            <input type="time" id="time_${slot}" value="${defaultTimes[slot]}">
        </div>
    `).join('');
}

// --- CORE ACTIONS ---
function saveMedicine() {
    const patientName = document.getElementById('patientName').value.trim();
    const medName = document.getElementById('medName').value.trim();
    const stock = parseInt(document.getElementById('stock').value) || 0;
    const doses = parseInt(document.getElementById('doses').value) || 1;

    if (!patientName || !medName || selectedSlots.size === 0) {
        showToast("Please fill name and pick a time!");
        return;
    }

    const schedule = {};
    selectedSlots.forEach(s => {
        schedule[s] = document.getElementById('time_'+s).value;
    });

    const medicine = {
        id: Date.now(),
        patientName, medName, stock, doses,
        colour: selectedColour,
        schedule
    };

    // Save for UI
    const data = getData();
    data.medicines.push(medicine);
    saveData(data);

    // Save for Service Worker (IndexedDB)
    syncToIndexedDB(medicine);

    showToast("✓ Saved Successfully!");
    renderDashboard();
    showPage('dashboard');
}

async function deleteMed(id) {
    // UI Remove
    const data = getData();
    data.medicines = data.medicines.filter(m => m.id !== id);
    saveData(data);

    // DB Remove
    const request = indexedDB.open('MedicareDB', 1);
    request.onsuccess = (e) => {
        const db = e.target.result;
        db.transaction('medicines', 'readwrite').objectStore('medicines').delete(id);
    };

    renderDashboard();
    showToast("Medicine Removed");
}

function renderDashboard() {
    const data = getData();
    document.getElementById('stat-total').textContent = [...new Set(data.medicines.map(m=>m.patientName))].length;
    document.getElementById('stat-low').textContent = data.medicines.filter(m=>m.stock < 5).length;

    const list = document.getElementById('med-list-dash');
    if(data.medicines.length === 0) {
        list.innerHTML = "<p style='color:var(--text2)'>No medicines added yet.</p>";
        return;
    }

    list.innerHTML = `
        <table class="med-table">
            <thead><tr><th>Patient</th><th>Medicine</th><th>Time</th><th>Stock</th><th>Action</th></tr></thead>
            <tbody>
                ${data.medicines.map(m => `
                    <tr>
                        <td><b>${m.patientName}</b></td>
                        <td><span style="display:inline-block;width:10px;height:10px;border-radius:50%;background:${m.colour.hex};margin-right:5px"></span>${m.medName}</td>
                        <td>${Object.values(m.schedule).join(', ')}</td>
                        <td>${m.stock}</td>
                        <td><button class="btn-danger" onclick="deleteMed(${m.id})">Delete</button></td>
                    </tr>
                `).join('')}
            </tbody>
        </table>
    `;
}

// --- UI NAVIGATION ---
function showPage(name) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
    document.getElementById('page-'+name).classList.add('active');
}

function showToast(m) {
    const t = document.getElementById('toast');
    t.textContent = m; t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 3000);
}

// --- INIT ---
document.addEventListener('DOMContentLoaded', () => {
    buildColours();
    renderDashboard();

    if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('sw.js').then(() => console.log("SW Active"));
    }
});
</script>
</body>
</html>
